<!-- Lantern & Ladle is a three-minute night-market cooking game.
     Follow ticket routes to chop toppings, time two burners, and assemble dishes in order.
     Serve before tickets expire to earn streak tips across three waves and see your results by wave. -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lantern &amp; Ladle</title>
</head>
<body>
  <main class="stage" aria-label="Lantern and Ladle">
    <canvas id="kitchen-game"
      width="1280" height="800" aria-label="Night market kitchen and live order board"></canvas>
    <nav id="service-buttons" aria-label="Service controls">
      <button id="route-button" aria-pressed="true">Route <kbd>T</kbd></button>
      <button id="book-button">Recipes <kbd>R</kbd></button>
      <button id="pause-button">Pause <kbd>P</kbd></button>
      <button id="sound-button" aria-pressed="false">Sound on <kbd>M</kbd></button>
    </nav>
    <section id="screen" hidden aria-label="Game menu"></section>
    <p id="announcement" role="status" class="visually-hidden"></p>
  </main>
  <link rel="stylesheet" href="./ui.css">
  <script type="module" src="./src/game.js"></script>
</body>
</html>
